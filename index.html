<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RPSLS Arena — Rock, Paper, Scissors</title>
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>
  <body>
  <div id="app">

    <header class="site-header">
      <h1 class="wordmark">
        <span>Rock</span><span>Paper</span><span>Scissors</span>
        </h1>
        <p class="premise">
        Three shapes, one loop, no way to outsmart it. First to five takes
        the match.
        </p>
    </header>

    <div class="shell">
      <main>
        <section aria-labelledby="score-heading">
            <h2 id="score-heading">Score</h2>
            <dl>
                <div>
                    <dt>Player</dt>
                    <dd id="player-score">0</dd>
                </div>
                <div>
                    <dt>Computer</dt>
                    <dd id="computer-score">0</dd>
                </div>
            </dl>
        </section>

        <section aria-labelledby="choice-heading">
            <h2 id="choice-heading">Choose your move</h2>
            <div>
                <button type="button" id="rock-button">Rock</button>
                <button type="button" id="paper-button">Paper</button>
                <button type="button" id="scissors-button">Scissors</button>
            </div>
        </section>

        <section aria-labelledby="result-heading" aria-live="polite">
            <h2 id="result-heading">Round result</h2>
            <p id="round-result">Make a choice to begin.</p>
            <p id="player-choice">Your choice: Not selected</p>
            <p id="computer-choice">Computer choice: Not selected</p>
        </section>

        <button type="button" id="reset-button">Reset game</button>
    </main>

    <script src="assets\JavaScript\script.js"></script>

    </div>
  </body>
</html>
